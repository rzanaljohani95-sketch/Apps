<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة المدينة المنورة</title>
<!--
  شاشة تلفاز خفيفة: الوقت، الطقس، إنذارات المركز الوطني للأرصاد، أوقات الصلاة.
  خلفية من صور مجلد images/ تتبدّل ببطء، وبطاقات شبه شفافة فوقها.
  بلا مكتبات ولا backdrop-filter (ثقيل على معالجات التلفاز)، ومكتوبة بـ ES5 +
  XMLHttpRequest لتعمل على متصفحات التلفزيونات القديمة.
-->
<style>
  :root { --glass:rgba(16,18,22,0.62); --glass-2:rgba(16,18,22,0.78); --text:#fff; --muted:rgba(255,255,255,0.68);
    --blue:#2747e6; --yellow:#f3b70a; --orange:#f47a16; --red:#de2f2a; --r:2.2vw; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#0d1410; color:var(--text);
    font-family:"Segoe UI", Tahoma, Arial, sans-serif; overflow:hidden; }

  /* طبقتا الخلفية: واحدة ظاهرة والأخرى تُحمَّل فيها الصورة التالية ثم تتبادلان */
  .bg { position:fixed; inset:0; top:0; right:0; bottom:0; left:0; background:#1d2a22 center/cover no-repeat;
    opacity:0; transition:opacity 2s linear; }
  .bg.on { opacity:1; }
  #shade { position:fixed; top:0; right:0; bottom:0; left:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.45) 100%); }

  #ui { position:relative; height:100%; padding:3.2vw 3.2vw 2.4vw; display:flex; flex-direction:column; }
  .pill { background:var(--glass); border-radius:var(--r); padding:1vw 1.8vw; }
  .muted { color:var(--muted); }

  /* الشريط العلوي */
  #top { display:flex; justify-content:space-between; align-items:flex-start; }
  #topLeft { display:flex; gap:1.4vw; align-items:stretch; }
  #city { font-size:1.6vw; font-weight:600; border-radius:5vw; padding:0.9vw 2vw; }
  #clockPill { text-align:right; }
  #clock { font-size:2.6vw; font-weight:700; line-height:1.1; }
  .small { font-size:1.15vw; line-height:1.45; }
  #weatherPill { display:flex; align-items:center; gap:1vw; }
  #wIcon { font-size:2.6vw; line-height:1; }
  #wTemp { font-size:2.4vw; font-weight:700; line-height:1.1; }

  /* البطاقات السفلية */
  #cards { margin-top:auto; display:flex; gap:1.4vw; align-items:stretch; }
  .card { border-radius:var(--r); padding:1.8vw 2vw; display:flex; flex-direction:column; justify-content:center; }
  .label { font-size:1.25vw; color:var(--muted); margin-bottom:0.5vw; }

  #nextCard { flex:1.45; background:var(--blue); }
  #nextCard .label { color:rgba(255,255,255,0.78); }
  #nextRow { display:flex; align-items:baseline; justify-content:space-between; gap:1.5vw; }
  #nextName { font-size:4.4vw; font-weight:800; line-height:1.15; }
  #countdown { font-size:3.6vw; font-weight:700; letter-spacing:0.1vw; }
  .chips { display:flex; gap:0.7vw; margin-top:1vw; }
  .chip { font-size:1.2vw; padding:0.35vw 1.1vw; border-radius:3vw; background:rgba(14,22,70,0.55); }
  .chip.light { background:#fff; color:#1b2a8a; font-weight:700; }

  #afterCard { flex:1; background:var(--glass-2); }
  .split { display:flex; justify-content:space-between; align-items:center; gap:1vw; }
  .big { font-size:2.3vw; font-weight:800; line-height:1.2; }
  .num { font-size:3.6vw; font-weight:800; line-height:1; text-align:center; }

  #alertCard { flex:1; background:var(--glass-2); }
  #alertCard.lvl-yellow { background:var(--yellow); color:#1a1a1a; }
  #alertCard.lvl-orange { background:var(--orange); color:#1a1a1a; }
  #alertCard.lvl-red    { background:var(--red); }
  #alertCard.lvl-yellow .label, #alertCard.lvl-orange .label, #alertCard.lvl-yellow .muted, #alertCard.lvl-orange .muted { color:rgba(0,0,0,0.62); }
  #alertTitle { font-size:2vw; font-weight:800; line-height:1.25; }
  #alertSub { font-size:1.15vw; margin-top:0.4vw; max-height:3.4vw; overflow:hidden; }
  #alertIcon { font-size:3.4vw; line-height:1; }

  /* شريط أوقات الصلاة */
  #dock { align-self:center; margin-top:1.6vw; display:flex; gap:0.6vw; padding:0.6vw; border-radius:4vw; background:var(--glass-2); }
  .p { text-align:center; padding:0.55vw 1.5vw; border-radius:3vw; }
  .p .n { font-size:1.05vw; color:var(--muted); }
  .p .t { font-size:1.55vw; font-weight:700; }
  .p.sun .t { color:var(--muted); }
  .p.next { background:#fff; color:#111; }
  .p.next .n { color:#555; }
</style>
</head>
<body>

<div id="bgA" class="bg"></div>
<div id="bgB" class="bg"></div>
<div id="shade"></div>

<div id="ui">
  <div id="top">
    <div id="city" class="pill">🕌 المدينة المنورة</div>
    <div id="topLeft">
      <div id="weatherPill" class="pill">
        <div id="wIcon">⏳</div>
        <div>
          <div id="wTemp">--°</div>
          <div id="wDesc" class="small muted">جارٍ تحميل الطقس…</div>
        </div>
      </div>
      <div id="clockPill" class="pill">
        <div id="clock">--:--</div>
        <div id="gDate" class="small"></div>
        <div id="hDate" class="small muted"></div>
      </div>
    </div>
  </div>

  <div id="cards">
    <div id="nextCard" class="card">
      <div class="label" id="nextLabel">الصلاة القادمة</div>
      <div id="nextRow">
        <div id="nextName">--</div>
        <div id="countdown">--:--:--</div>
      </div>
      <div class="chips">
        <span class="chip light" id="nextTime">--</span>
        <span class="chip">تقويم أم القرى</span>
      </div>
    </div>

    <div id="afterCard" class="card">
      <div class="split">
        <div>
          <div class="label">ثم</div>
          <div class="big" id="afterName">--</div>
          <div class="small muted" id="afterSub"></div>
        </div>
        <div>
          <div class="num" id="afterTime">--</div>
          <div class="small muted" id="afterAmPm" style="text-align:center"></div>
        </div>
      </div>
    </div>

    <div id="alertCard" class="card">
      <div class="split">
        <div>
          <div class="label">المركز الوطني للأرصاد</div>
          <div id="alertTitle">جارٍ التحقق…</div>
          <div id="alertSub" class="muted"></div>
        </div>
        <div id="alertIcon"></div>
      </div>
    </div>
  </div>

  <div id="dock"></div>
</div>

<script>
(function () {
  'use strict';

  /* ============================ SETTINGS ============================ */

  var LAT = 24.4672, LON = 39.6111;   // المدينة المنورة
  var TZ_OFFSET_H = 3;                 // توقيت السعودية UTC+3 بلا توقيت صيفي

  // صور الخلفية: انسخ صور التلفاز إلى مجلد images/ بهذه الأسماء (أو عدّل القائمة).
  // الأسماء غير الموجودة تُتجاوز تلقائياً. يُفضّل JPG بمقاس 1920×1080 لتوفير الذاكرة.
  var BG_IMAGES = [];
  for (var bi = 1; bi <= 30; bi++) BG_IMAGES.push('images/' + bi + '.jpg');
  var BG_EVERY_MS = 5 * 60 * 1000;

  var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m' +
    '&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FRiyadh&forecast_days=1';

  // واجهة إنذارات المركز الوطني للأرصاد (EWS API — GetNotifications).
  // إن منعها متصفح التلفاز (CORS) يمكن وضع رابط وسيط هنا بدلاً منها.
  var ALERT_URLS = [
    'https://api.ncm.gov.sa/api/weather/getnotifications'
  ];

  var WEATHER_EVERY_MS = 15 * 60 * 1000;
  var ALERTS_EVERY_MS = 10 * 60 * 1000;

  var PRAYERS = [
    { key: 'Fajr',    name: 'الفجر' },
    { key: 'Sunrise', name: 'الشروق', sun: true },
    { key: 'Dhuhr',   name: 'الظهر' },
    { key: 'Asr',     name: 'العصر' },
    { key: 'Maghrib', name: 'المغرب' },
    { key: 'Isha',    name: 'العشاء' }
  ];

  /* ============================ HELPERS ============================ */

  function $(id) { return document.getElementById(id); }

  var AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
  function ar(s) { return String(s).replace(/[0-9]/g, function (c) { return AR_DIGITS.charAt(+c); }); }

  // يحدّث النص فقط إذا تغيّر (بأرقام عربية)، لتجنّب إعادة الرسم بلا داعٍ.
  function setText(el, txt) { txt = ar(txt); if (el.textContent !== txt) el.textContent = txt; }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // وقت المدينة المنورة كـ Date "مُزاح" تُقرأ قيمه بدوال getUTC* — لا يعتمد على
  // منطقة التلفاز الزمنية ولا على دعم Intl timeZone في المتصفحات القديمة.
  function madinahNow() { return new Date(Date.now() + TZ_OFFSET_H * 3600000); }

  function dayKey(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }

  function hm(mins) {
    var h = Math.floor(mins / 60) % 24, m = Math.round(mins % 60);
    if (m === 60) { h = (h + 1) % 24; m = 0; }
    return [(h % 12 || 12) + ':' + pad(m), h < 12 ? 'ص' : 'م'];
  }
  function fmt12(mins) { var x = hm(mins); return x[0] + ' ' + x[1]; }

  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        var data;
        try { data = JSON.parse(x.responseText); } catch (e) { fail('bad json'); return; }
        ok(data);
      } else { fail('http ' + x.status); }
      x = null;
    };
    x.ontimeout = function () { fail('timeout'); };
    x.send();
  }

  /* ============================ BACKGROUND ============================ */

  var bgLayers = [$('bgA'), $('bgB')], bgShown = 0, bgIdx = -1, bgFails = 0;

  // يحمّل الصورة التالية في الطبقة المخفية ثم يُظهرها، ويُفرغ الطبقة القديمة
  // بعد انتهاء التلاشي حتى لا تبقى صورتان مفكوكتان في الذاكرة.
  function nextBackground() {
    if (bgFails >= BG_IMAGES.length) return;   // لا توجد صور: تبقى الخلفية الداكنة
    bgIdx = (bgIdx + 1) % BG_IMAGES.length;
    var url = BG_IMAGES[bgIdx], img = new Image();
    img.onload = function () {
      bgFails = 0;
      var hidden = bgLayers[1 - bgShown], old = bgLayers[bgShown];
      hidden.style.backgroundImage = 'url("' + url + '")';
      hidden.className = 'bg on';
      old.className = 'bg';
      bgShown = 1 - bgShown;
      setTimeout(function () { old.style.backgroundImage = 'none'; }, 2500);
      img = null;
    };
    img.onerror = function () { img = null; bgFails++; nextBackground(); };
    img.src = url;
  }

  /* ============================ CLOCK ============================ */

  var G_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  var DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

  function renderClock(now) {
    setText($('clock'), fmt12(now.getUTCHours() * 60 + now.getUTCMinutes()));
    setText($('gDate'), DAYS[now.getUTCDay()] + ' ' + now.getUTCDate() + ' ' + G_MONTHS[now.getUTCMonth()] + ' ' + now.getUTCFullYear());
  }

  /* ============================ WEATHER ============================ */

  // رموز WMO المستخدمة في Open-Meteo
  function weatherInfo(code) {
    if (code === 0) return ['☀️', 'صحو'];
    if (code === 1) return ['🌤️', 'مشمس غالباً'];
    if (code === 2) return ['⛅', 'غائم جزئياً'];
    if (code === 3) return ['☁️', 'غائم'];
    if (code === 45 || code === 48) return ['🌫️', 'ضباب'];
    if (code >= 51 && code <= 57) return ['🌦️', 'رذاذ'];
    if (code >= 61 && code <= 67) return ['🌧️', 'أمطار'];
    if (code >= 71 && code <= 77) return ['🌨️', 'ثلوج'];
    if (code >= 80 && code <= 82) return ['🌧️', 'زخات مطر'];
    if (code >= 95) return ['⛈️', 'عواصف رعدية'];
    return ['🌡️', '—'];
  }

  function loadWeather() {
    getJSON(WEATHER_URL, function (d) {
      var c = d.current || {}, daily = d.daily || {};
      var info = weatherInfo(c.weather_code);
      setText($('wIcon'), info[0]);
      setText($('wTemp'), Math.round(c.temperature_2m) + '°');
      var desc = info[1];
      if (daily.temperature_2m_max) desc += ' · ع ' + Math.round(daily.temperature_2m_max[0]) + ' ص ' + Math.round(daily.temperature_2m_min[0]);
      setText($('wDesc'), desc);
    }, function () { setText($('wDesc'), 'تعذّر تحديث الطقس'); });
  }

  /* ============================ NCM ALERTS ============================ */

  var MADINAH_RE = /المدينة|madina|medina/i;

  function levelOf(text) {
    if (/red|أحمر|حمراء/i.test(text)) return 'red';
    if (/orange|برتقالي/i.test(text)) return 'orange';
    if (/yellow|أصفر|صفراء/i.test(text)) return 'yellow';
    return '';
  }
  var LEVEL_NAME = { red: 'أحمر', orange: 'برتقالي', yellow: 'أصفر' };
  var LEVEL_RANK = { red: 3, orange: 2, yellow: 1, '': 0 };

  // أول قيمة نصية لحقل يطابق اسمه النمط (بحث مسطّح في الكائن).
  function pick(obj, re) {
    for (var k in obj) {
      if (re.test(k) && obj[k] != null && typeof obj[k] !== 'object' && String(obj[k]) !== '') return String(obj[k]);
    }
    return '';
  }

  function toList(d) {
    if (d && d.length !== undefined) return d;
    if (d && typeof d === 'object') {
      for (var k in d) if (d[k] && d[k].length !== undefined && typeof d[k] !== 'string') return d[k];
    }
    return [];
  }

  function parseAlerts(data) {
    var list = toList(data), out = [];
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      if (!a || typeof a !== 'object') continue;
      var json = JSON.stringify(a);
      if (!MADINAH_RE.test(json)) continue;
      var colorField = pick(a, /colou?r|level|severity|لون/i);
      out.push({
        level: levelOf(colorField) || levelOf(json),
        type: pick(a, /^(alert)?(type|event|phenomen)|eventName|alertType|alertName|nameAr|titleAr|title/i) || 'تنبيه جوي',
        desc: pick(a, /descriptionAr|description|desc|message|text/i),
        until: pick(a, /to_?date|end|expir|until/i)
      });
    }
    out.sort(function (x, y) { return LEVEL_RANK[y.level] - LEVEL_RANK[x.level]; });
    return out;
  }

  function showAlert(cls, icon, title, sub) {
    $('alertCard').className = 'card' + (cls ? ' lvl-' + cls : '');
    setText($('alertIcon'), icon);
    setText($('alertTitle'), title);
    setText($('alertSub'), sub);
  }

  function renderAlerts(alerts) {
    if (!alerts.length) { showAlert('', '✓', 'لا توجد إنذارات', 'على المدينة المنورة حالياً'); return; }
    var top = alerts[0];
    var sub = top.type;
    if (top.until) sub += ' · حتى ' + top.until;
    if (alerts.length > 1) sub += ' · +' + (alerts.length - 1) + ' أخرى';
    if (sub.length > 120) sub = sub.slice(0, 117) + '…';
    showAlert(top.level, '⚠', top.level ? 'إنذار ' + LEVEL_NAME[top.level] : 'إنذار', sub);
  }

  function loadAlerts(i) {
    i = i || 0;
    if (i >= ALERT_URLS.length) { showAlert('', '?', 'تعذّر الاتصال', 'تحقق من ncm.gov.sa — إعادة المحاولة تلقائياً'); return; }
    getJSON(ALERT_URLS[i], function (d) { renderAlerts(parseAlerts(d)); },
      function () { loadAlerts(i + 1); });
  }

  /* ============================ PRAYER TIMES ============================ */

  var times = null;        // { day:'YYYY-MM-DD', Fajr: دقائق منذ منتصف الليل, ... }
  var nextIdxShown = -1;

  // حساب محلي احتياطي بطريقة أم القرى (الفجر 18.5°، العشاء بعد المغرب بـ 90 دقيقة،
  // العصر الشافعي) — يُستخدم إن تعذّر الاتصال بـ Aladhan، بدقة دقيقة تقريباً.
  function computeTimes(y, mo, d) {
    var rad = Math.PI / 180;
    var jd = Date.UTC(y, mo - 1, d, 12) / 86400000 + 2440587.5 - LON / 360;
    var n = jd - 2451545.0;
    var g = (357.529 + 0.98560028 * n) * rad;
    var q = 280.459 + 0.98564736 * n;
    var L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
    var e = (23.439 - 0.00000036 * n) * rad;
    var ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / rad / 15;
    var decl = Math.asin(Math.sin(e) * Math.sin(L));
    var eqt = q / 15 - ra; eqt = eqt - 24 * Math.round(eqt / 24);
    var noon = 12 + TZ_OFFSET_H - LON / 15 - eqt;   // ساعات بالتوقيت المحلي
    var lat = LAT * rad;
    function hourAngle(alt) {
      return Math.acos((Math.sin(alt) - Math.sin(lat) * Math.sin(decl)) / (Math.cos(lat) * Math.cos(decl))) / rad / 15;
    }
    var sunAlt = -0.833 * rad;
    var asrAlt = Math.atan(1 / (1 + Math.tan(Math.abs(lat - decl))));
    var maghrib = noon + hourAngle(sunAlt);
    return {
      Fajr: (noon - hourAngle(-18.5 * rad)) * 60,
      Sunrise: (noon - hourAngle(sunAlt)) * 60,
      Dhuhr: noon * 60 + 1,
      Asr: (noon + hourAngle(asrAlt)) * 60,
      Maghrib: maghrib * 60,
      Isha: maghrib * 60 + 90
    };
  }

  function toMins(hhmm) { var p = String(hhmm).split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }

  function pClass(i) { return 'p' + (PRAYERS[i].sun ? ' sun' : ''); }

  function buildDock() {
    var html = '';
    for (var i = 0; i < PRAYERS.length; i++) {
      html += '<div class="' + pClass(i) + '" id="p' + i + '"><div class="n">' + PRAYERS[i].name +
        '</div><div class="t" id="pt' + i + '">--</div></div>';
    }
    $('dock').innerHTML = html;
  }

  function setTimes(day, t, hijri) {
    times = t; times.day = day;
    for (var i = 0; i < PRAYERS.length; i++) setText($('pt' + i), fmt12(t[PRAYERS[i].key]));
    setText($('hDate'), hijri || '');
    nextIdxShown = -1;
  }

  function loadPrayerTimes(now) {
    var day = dayKey(now);
    var y = now.getUTCFullYear(), m = now.getUTCMonth() + 1, d = now.getUTCDate();
    // نعرض الحساب المحلي فوراً ثم نستبدله بأوقات Aladhan (أم القرى) عند وصولها.
    setTimes(day, computeTimes(y, m, d), '');
    var url = 'https://api.aladhan.com/v1/timings/' + pad(d) + '-' + pad(m) + '-' + y +
      '?latitude=' + LAT + '&longitude=' + LON + '&method=4';
    getJSON(url, function (res) {
      if (!res || !res.data || !res.data.timings || dayKey(madinahNow()) !== day) return;
      var t = {}, src = res.data.timings;
      for (var i = 0; i < PRAYERS.length; i++) t[PRAYERS[i].key] = toMins(src[PRAYERS[i].key]);
      var h = res.data.date && res.data.date.hijri;
      setTimes(day, t, h ? parseInt(h.day, 10) + ' ' + h.month.ar + ' ' + h.year + ' هـ' : '');
    }, function () {});
  }

  function prayerLabel(i) { return PRAYERS[i].sun ? 'الشروق' : PRAYERS[i].name; }

  function renderPrayers(now) {
    if (!times || times.day !== dayKey(now)) loadPrayerTimes(now);
    var secNow = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
    var next = -1;
    for (var i = 0; i < PRAYERS.length; i++) {
      if (Math.round(times[PRAYERS[i].key]) * 60 > secNow) { next = i; break; }
    }
    var target;
    if (next === -1) { next = 0; target = Math.round(times.Fajr) * 60 + 86400; }  // فجر الغد (تقريبي بفارق دقيقة)
    else target = Math.round(times[PRAYERS[next].key]) * 60;

    if (next !== nextIdxShown) {
      if (nextIdxShown >= 0) $('p' + nextIdxShown).className = pClass(nextIdxShown);
      $('p' + next).className = 'p next';
      setText($('nextLabel'), PRAYERS[next].sun ? 'الشروق القادم' : 'الصلاة القادمة');
      setText($('nextName'), prayerLabel(next));
      setText($('nextTime'), fmt12(times[PRAYERS[next].key]));
      var after = (next + 1) % PRAYERS.length, a = hm(times[PRAYERS[after].key]);
      var afterNext = (after + 1) % PRAYERS.length;
      setText($('afterName'), prayerLabel(after));
      setText($('afterTime'), a[0]);
      setText($('afterAmPm'), a[1] === 'ص' ? 'صباحاً' : 'مساءً');
      setText($('afterSub'), 'ثم ' + prayerLabel(afterNext) + ' ' + fmt12(times[PRAYERS[afterNext].key]));
      nextIdxShown = next;
    }
    var left = target - secNow;
    setText($('countdown'), pad(Math.floor(left / 3600)) + ':' + pad(Math.floor(left / 60) % 60) + ':' + pad(left % 60));
  }

  /* ============================ MAIN LOOP ============================ */

  var startedDay = dayKey(madinahNow());

  function tick() {
    var now = madinahNow();
    renderClock(now);
    renderPrayers(now);
    // إعادة تحميل يومية الساعة 3 فجراً لتفريغ ذاكرة متصفح التلفاز من أي تراكم.
    if (dayKey(now) !== startedDay && now.getUTCHours() === 3) { location.reload(); return; }
    // مؤقت واحد يُضبط على بداية الثانية التالية بدل setInterval.
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }

  buildDock();
  tick();
  nextBackground();
  loadWeather();
  loadAlerts();
  setInterval(nextBackground, BG_EVERY_MS);
  setInterval(loadWeather, WEATHER_EVERY_MS);
  setInterval(function () { loadAlerts(); }, ALERTS_EVERY_MS);
})();
</script>
